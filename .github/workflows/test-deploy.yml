name: Run Test Suite

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~
  release:
    types: [prereleased, released]

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:coverage

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true
  publish:
    name: >-
      Publish cli 📦 to NPM
    if:
      github.repository_owner == 'all-contributors' && github.event_name ==
      'release'
    needs:
      - test
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/all-contributors-cli
    permissions:
      id-token: write # mandatory for OIDC / NPM publishing
      contents: read
    steps:
      - uses: $/.github/actions/setup
        with:
          node-version: '24'
      - name: Build package
        run: |
          npm run build
      - name: Publish to NPM via trusted publishing (tag next if prerelease)
        run: |
          if [[ "${{ github.event.release.prerelease }}" == "true" ]]; then
            npm publish --provenance --tag next
          else
            npm publish --provenance
          fi
