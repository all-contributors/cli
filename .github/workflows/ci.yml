name: CI

on:
  pull_request: ~
  push:
    branches:
      - main

jobs:
  dedupe_check:
    name: Dedupe Check
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm dedupe --check

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm test:e2e

  engines_check:
    name: Engines Check (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.22.0
          - 22
          - 23
          - 24.0.0
          - 24
          - 25
          - 26.0.0
          - 26
    steps:
      - uses: $/.github/actions/setup
        with:
          cache: false
          install-flags: --prod --engine-strict --ignore-scripts
          node-version: ${{ matrix.node-version }}

  format_check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm format --list-different

  knip:
    name: Knip
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm knip

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: $/.github/actions/setup
      - run: pnpm build
      - run: pnpm test --coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: false
          use_oidc: true
