name: Lint

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

jobs:
  format_check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: npm run format -- --list-different

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - run: npm run lint
